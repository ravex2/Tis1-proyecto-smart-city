services:
  # Aplicación PHP
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php-servidor
    volumes:
      - ./src:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_NAME=smart_city
      - DB_USER=root
      - DB_PASS=mi_password_seguro
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WS_HOST=node-websocket
      - WS_PORT=3000
    env_file:
      - .env
    networks:
      - app-network
    restart: unless-stopped

  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: smart_city
      MYSQL_ROOT_PASSWORD: mi_password_seguro
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network

  # Redis para Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: redis-server
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    networks:
      - app-network

  # Servidor WebSocket (Node.js)
  node-websocket:
    build:
      context: ./websocket-server
      dockerfile: Dockerfile
    container_name: websocket-server
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - db
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
      - DB_NAME=smart_city
      - DB_USER=root
      - DB_PASS=mi_password_seguro
      - DB_PORT=3306
      - PORT=3000
      - JWT_SECRET=tu_secreto_jwt_aqui_cambiar_en_produccion
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data: